<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Chapter - Perpustakaan Manhwa</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode">🌙</button>

    <div style="position: absolute; top: 20px; left: 20px; z-index: 2000;">
        <a href="about.html" class="btn-secondary" style="padding: 10px 16px; font-size: 0.9rem;">About</a>
    </div>

    <div class="container">
        <header>
            <h1>Arsip Chapter</h1>
            <p>Daftar lengkap chapter Manhwa dari awal hingga terbaru.</p>
            
            <div class="search-box-wrapper" style="margin: 25px auto 10px auto; max-width: 400px;">
                <input type="text" id="searchInput" placeholder="Cari chapter (misal: Chapter 3, Sekutu)..." class="search-input">
            </div>

            <div style="margin-top: 20px;">
                <a href="index.html" class="btn-secondary">← Kembali ke Beranda</a>
            </div>
        </header>

        <main class="archive-container">
            <ul class="chapter-list" id="chapterList">
                <!-- Loaded dynamically via Fetch API from chapters.json -->
            </ul>
        </main>
    </div>

    <script>
        // Smooth Page Transition Fade-In
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        // Light/Dark Mode Script
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // Fetch chapters.json and populate list
        fetch('chapters.json')
            .then(res => res.json())
            .then(chapters => {
                const chapterList = document.getElementById('chapterList');
                chapterList.innerHTML = chapters.map(ch => `
                    <li>
                        <a href="${ch.link}" class="chapter-item">
                            <span class="ch-number">Chapter ${ch.id}</span>
                            <span class="ch-title">${ch.title}</span>
                            <span class="ch-date">${ch.date}</span>
                        </a>
                    </li>
                `).join('');

                const searchInput = document.getElementById('searchInput');
                const items = chapterList.getElementsByTagName('li');

                searchInput.addEventListener('input', (e) => {
                    const query = e.target.value.toLowerCase();
                    for (let item of items) {
                        const text = item.textContent.toLowerCase();
                        if (text.includes(query)) {
                            item.style.display = '';
                        } else {
                            item.style.display = 'none';
                        }
                    }
                });
            })
            .catch(err => console.error('Failed to load chapters.json', err));
    </script>
</body>
</html>
