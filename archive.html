<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Chapter - Perpustakaan Manhwa</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode">🌙</button>

    <div class="container">
        <header>
            <h1>Arsip Chapter</h1>
            <p>Daftar lengkap chapter Manhwa dari awal hingga terbaru.</p>
            
            <div class="search-box-wrapper" style="margin: 20px auto 10px auto; max-width: 400px;">
                <input type="text" id="searchInput" placeholder="Cari chapter (misal: Chapter 3, Sekutu)..." class="search-input">
            </div>

            <!-- Genre Filter Buttons (3+ genres: Semua, Action, Fantasy, Adventure) -->
            <div class="genre-filters-wrapper" id="genreFilters">
                <button class="genre-filter-btn active" data-genre="all">Semua</button>
                <button class="genre-filter-btn" data-genre="Action">Action</button>
                <button class="genre-filter-btn" data-genre="Fantasy">Fantasy</button>
                <button class="genre-filter-btn" data-genre="Adventure">Adventure</button>
            </div>

            <div style="margin-top: 15px;">
                <a href="index.html" class="btn-secondary">← Kembali ke Beranda</a>
            </div>
        </header>

        <main class="archive-container">
            <div class="archive-grid" id="chapterGrid">
                <!-- Loaded dynamically via Fetch API from chapters.json into Grid Cards -->
            </div>
        </main>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="archive.html" class="bottom-nav-item active">
            <span class="icon">📚</span>
            <span>Arsip</span>
        </a>
        <a href="about.html" class="bottom-nav-item">
            <span class="icon">👤</span>
            <span>About</span>
        </a>
    </nav>

    <script>
        // Smooth Page Transition Fade-In
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        // Light/Dark Mode Script
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // Fetch chapters.json and populate Grid with badges and filter logic
        fetch('chapters.json')
            .then(res => res.json())
            .then(chapters => {
                const chapterGrid = document.getElementById('chapterGrid');
                chapterGrid.innerHTML = chapters.map(ch => `
                    <a href="${ch.link}" class="archive-card" data-genre="${ch.genre || 'Action'}" data-search="${ch.title.toLowerCase()} chapter ${ch.id} ${(ch.genre || '').toLowerCase()}">
                        <div class="archive-card-img-wrapper">
                            <img src="images/chapter-1/01.jpg" alt="Chapter ${ch.id}" class="archive-card-img" loading="lazy">
                            <span class="genre-badge">${ch.genre || 'Action'}</span>
                        </div>
                        <div class="archive-card-body">
                            <span class="archive-card-number">Chapter ${ch.id}</span>
                            <span class="archive-card-title">${ch.title}</span>
                            <span class="archive-card-date">${ch.date}</span>
                        </div>
                    </a>
                `).join('');

                const searchInput = document.getElementById('searchInput');
                const cards = chapterGrid.getElementsByClassName('archive-card');
                const filterBtns = document.querySelectorAll('.genre-filter-btn');

                let currentGenre = 'all';
                let currentQuery = '';

                function filterCards() {
                    for (let card of cards) {
                        const cardGenre = card.getAttribute('data-genre');
                        const searchData = card.getAttribute('data-search');
                        
                        const matchesGenre = (currentGenre === 'all' || cardGenre === currentGenre);
                        const matchesSearch = searchData.includes(currentQuery);

                        if (matchesGenre && matchesSearch) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    }
                }

                searchInput.addEventListener('input', (e) => {
                    currentQuery = e.target.value.toLowerCase();
                    filterCards();
                });

                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentGenre = btn.getAttribute('data-genre');
                        filterCards();
                    });
                });
            })
            .catch(err => console.error('Failed to load chapters.json in archive', err));
    </script>
</body>
</html>
