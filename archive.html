<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Chapter - Perpustakaan Manhwa</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode">🌙</button>

    <div class="container">
        <header>
            <h1>Arsip Chapter</h1>
            <p>Daftar lengkap chapter Manhwa dari awal hingga terbaru.</p>
            
            <div class="search-box-wrapper" style="margin: 20px auto 10px auto; max-width: 400px;">
                <input type="text" id="searchInput" placeholder="Cari chapter (misal: Chapter 3, Sekutu)..." class="search-input">
            </div>

            <!-- Genre Filter Buttons (3+ genres: Semua, Action, Fantasy, Adventure) -->
            <div class="genre-filters-wrapper" id="genreFilters">
                <button class="genre-filter-btn active" data-genre="all">Semua</button>
                <button class="genre-filter-btn" data-genre="Action">Action</button>
                <button class="genre-filter-btn" data-genre="Fantasy">Fantasy</button>
                <button class="genre-filter-btn" data-genre="Adventure">Adventure</button>
            </div>

            <div style="margin-top: 15px;">
                <a href="index.html" class="btn-secondary">← Kembali ke Beranda</a>
            </div>
        </header>

        <main class="archive-container">
            <div class="archive-grid" id="chapterGrid">
                <!-- Loaded dynamically via Fetch API from chapters.json into Grid Cards -->
            </div>
        </main>
    </div>

    <!-- Floating Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="bottom-nav-item">
            <span class="icon">🏠</span>
            <span>Home</span>
        </a>
        <a href="archive.html" class="bottom-nav-item active">
            <span class="icon">📚</span>
            <span>Arsip</span>
        </a>
        <a href="about.html" class="bottom-nav-item">
            <span class="icon">👤</span>
            <span>About</span>
        </a>
    </nav>

    <script>
        // Smooth Page Transition Fade-In
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        // Light/Dark Mode Script
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // Scroll Reveal Animation & Skeleton Loading Handler
        function initCardEffects() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('revealed');
                        obs.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            const cards = document.querySelectorAll('.manhwa-card, .archive-card');
            cards.forEach(card => {
                if (!card.classList.contains('reveal-card')) {
                    card.classList.add('reveal-card');
                    observer.observe(card);
                }
            });

            const cardImages = document.querySelectorAll('.card-img-wrapper img, .archive-card-img-wrapper img');
            cardImages.forEach(img => {
                const wrapper = img.closest('.card-img-wrapper, .archive-card-img-wrapper');
                const markLoaded = () => {
                    img.classList.add('loaded');
                    if (wrapper) {
                        wrapper.classList.add('loaded');
                    }
                };

                if (img.complete) {
                    markLoaded();
                } else {
                    img.addEventListener('load', markLoaded);
                    img.addEventListener('error', markLoaded);
                }
            });
        }

        // Fetch chapters.json and populate Grid with badges and filter logic
        fetch('chapters.json')
            .then(res => res.json())
            .then(chapters => {
                const maxId = Math.max(...chapters.map(c => c.id));
                const chapterGrid = document.getElementById('chapterGrid');
                chapterGrid.innerHTML = chapters.map(ch => {
                    const isNew = (ch.id === maxId);
                    return `
                    <a href="${ch.link}" class="archive-card" data-genre="${ch.genre || 'Action'}" data-search="${ch.title.toLowerCase()} chapter ${ch.id} ${(ch.genre || '').toLowerCase()}">
                        <div class="archive-card-img-wrapper">
                            <img src="images/chapter-1/01.jpg" alt="Chapter ${ch.id}" class="archive-card-img" loading="lazy">
                            <span class="genre-badge">${ch.genre || 'Action'}</span>
                            ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                        </div>
                        <div class="archive-card-body">
                            <span class="archive-card-number">Chapter ${ch.id}</span>
                            <span class="archive-card-title">${ch.title}</span>
                            <span class="archive-card-date">${ch.date}</span>
                        </div>
                    </a>
                `;
                }).join('');

                initCardEffects();

                const searchInput = document.getElementById('searchInput');
                const cards = chapterGrid.getElementsByClassName('archive-card');
                const filterBtns = document.querySelectorAll('.genre-filter-btn');

                let currentGenre = 'all';
                let currentQuery = '';

                function filterCards() {
                    for (let card of cards) {
                        const cardGenre = card.getAttribute('data-genre');
                        const searchData = card.getAttribute('data-search');
                        
                        const matchesGenre = (currentGenre === 'all' || cardGenre === currentGenre);
                        const matchesSearch = searchData.includes(currentQuery);

                        if (matchesGenre && matchesSearch) {
                            card.style.display = 'flex';
                        } else {
                            card.style.display = 'none';
                        }
                    }
                }

                searchInput.addEventListener('input', (e) => {
                    currentQuery = e.target.value.toLowerCase();
                    filterCards();
                });

                filterBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        currentGenre = btn.getAttribute('data-genre');
                        filterCards();
                    });
                });
            })
            .catch(err => console.error('Failed to load chapters.json in archive', err));

        // Floating Action Button (FAB) Logic
        const fabContainer = document.createElement('div');
        fabContainer.className = 'fab-container';
        fabContainer.innerHTML = `
            <div id="fabMenu" class="fab-menu">
                <button id="fabThemeToggle" class="fab-menu-item">
                    <span>🌓</span> Mode Terang/Gelap
                </button>
                <button id="fabScrollTop" class="fab-menu-item">
                    <span>⬆️</span> Ke Atas
                </button>
            </div>
            <button id="fabMainBtn" class="fab-btn" title="Menu Cepat">
                ⚙️
            </button>
        `;
        document.body.appendChild(fabContainer);

        const fabMainBtn = document.getElementById('fabMainBtn');
        const fabThemeToggle = document.getElementById('fabThemeToggle');
        const fabScrollTop = document.getElementById('fabScrollTop');

        fabMainBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            fabContainer.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!fabContainer.contains(e.target)) {
                fabContainer.classList.remove('active');
            }
        });

        fabThemeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            if (themeToggleBtn) {
                themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
            }
            fabContainer.classList.remove('active');
        });

        fabScrollTop.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            fabContainer.classList.remove('active');
        });

        window.addEventListener('DOMContentLoaded', () => {
            initCardEffects();
        });
    </script>
</body>
</html>
