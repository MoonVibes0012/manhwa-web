<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arsip Chapter - Perpustakaan Manhwa</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <button id="themeToggle" class="theme-toggle-btn" title="Toggle Light/Dark Mode">🌙</button>

    <div class="container">
        <header>
            <h1>Arsip Chapter</h1>
            <p>Daftar lengkap chapter Manhwa dari awal hingga terbaru.</p>
            
            <div class="search-box-wrapper" style="margin: 25px auto 10px auto; max-width: 400px;">
                <input type="text" id="searchInput" placeholder="Cari chapter (misal: Chapter 3, Sekutu)..." class="search-input">
            </div>

            <div style="margin-top: 20px;">
                <a href="index.html" class="btn-secondary">← Kembali ke Beranda</a>
            </div>
        </header>

        <main class="archive-container">
            <ul class="chapter-list" id="chapterList">
                <li>
                    <a href="reader.html?chapter=5" class="chapter-item">
                        <span class="ch-number">Chapter 5</span>
                        <span class="ch-title">Pertempuran Akhir</span>
                        <span class="ch-date">Terbaru</span>
                    </a>
                </li>
                <li>
                    <a href="reader.html?chapter=4" class="chapter-item">
                        <span class="ch-number">Chapter 4</span>
                        <span class="ch-title">Kebangkitan Kekuatan</span>
                        <span class="ch-date">-</span>
                    </a>
                </li>
                <li>
                    <a href="reader.html?chapter=3" class="chapter-item">
                        <span class="ch-number">Chapter 3</span>
                        <span class="ch-title">Sekutu Baru</span>
                        <span class="ch-date">-</span>
                    </a>
                </li>
                <li>
                    <a href="reader.html?chapter=2" class="chapter-item">
                        <span class="ch-number">Chapter 2</span>
                        <span class="ch-title">Jejak Misterius</span>
                        <span class="ch-date">-</span>
                    </a>
                </li>
                <li>
                    <a href="reader.html?chapter=1" class="chapter-item">
                        <span class="ch-number">Chapter 1</span>
                        <span class="ch-title">Awal Perjalanan</span>
                        <span class="ch-date">-</span>
                    </a>
                </li>
            </ul>
        </main>
    </div>

    <script>
        // Light/Dark Mode Script
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // Search Filter Script
        const searchInput = document.getElementById('searchInput');
        const chapterList = document.getElementById('chapterList');
        const items = chapterList.getElementsByTagName('li');

        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            for (let item of items) {
                const text = item.textContent.toLowerCase();
                if (text.includes(query)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
