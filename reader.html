<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 1 - Perpustakaan Manhwa</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="reader-body">
    <div id="progress-bar"></div>

    <nav class="sticky-nav">
        <div style="display: flex; align-items: center; gap: 15px;">
            <a href="index.html">← Kembali</a>
            <a href="about.html" style="font-size: 0.9rem; color: var(--text-muted) !important;">About</a>
        </div>
        <span class="chapter-title-nav" id="chapterTitleNav">Chapter 1</span>
        <button id="themeToggle" class="theme-toggle-btn" style="position:static; margin-left: auto;" title="Toggle Light/Dark Mode">🌙</button>
    </nav>

    <!-- Reader Settings Toolbar (Sempit, Normal, Lebar, Auto-Scroll) -->
    <div class="reader-settings-bar">
        <span>Lebar:</span>
        <button class="btn-setting" data-width="narrow">Sempit</button>
        <button class="btn-setting active" data-width="normal">Normal</button>
        <button class="btn-setting" data-width="wide">Lebar</button>
        <span style="margin-left: 10px; border-left: 1px solid var(--border); padding-left: 10px;">
            <button id="autoScrollBtn" class="btn-setting" style="background-color: var(--accent); color: #fff; font-weight: 600;">▶️ Auto-Scroll</button>
        </span>
    </div>

    <div class="reader-container normal" id="manhwaContainer">
        <img src="images/chapter-1/01.jpg" alt="Page 1" class="manhwa-page" loading="lazy">
        <img src="images/chapter-1/02.jpg" alt="Page 2" class="manhwa-page" loading="lazy">
        <img src="images/chapter-1/03.jpg" alt="Page 3" class="manhwa-page" loading="lazy">
        
        <div class="chapter-navigation">
            <a href="#" class="btn-chapter prev-chapter" id="prevBtn">⬅️ Prev</a>
            <button class="btn-chapter share-chapter" id="shareBtn">Bagikan 🔗</button>
            <a href="#" class="btn-chapter next-chapter" id="nextBtn">Next ➡️</a>
        </div>
    </div>

    <button id="backToTop" class="back-to-top" title="Back to Top">⬆️ Back to Top</button>

    <!-- Auto-Next Chapter Modal Popup -->
    <div id="autoNextModal" class="modal-overlay">
        <div class="modal-card">
            <h3>Lanjut ke Chapter Berikutnya?</h3>
            <p>Kamu sudah membaca sampai akhir halaman.</p>
            <div class="modal-actions">
                <a href="#" id="modalNextBtn" class="btn-read">Lanjut Chapter</a>
                <button id="modalCloseBtn" class="btn-secondary">Tutup</button>
            </div>
        </div>
    </div>

    <script>
        // Smooth Page Transition Fade-In
        window.addEventListener('DOMContentLoaded', () => {
            document.body.classList.add('fade-in');
        });

        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }

        // Determine current chapter number from URL query params
        const urlParams = new URLSearchParams(window.location.search);
        let chNum = parseInt(urlParams.get('chapter')) || 1;

        document.title = 'Chapter ' + chNum + ' - Perpustakaan Manhwa';
        document.getElementById('chapterTitleNav').textContent = 'Chapter ' + chNum;

        // Setup Previous and Next chapter links dynamically
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const modalNextBtn = document.getElementById('modalNextBtn');

        const prevCh = Math.max(1, chNum - 1);
        const nextCh = chNum + 1;

        const prevUrl = 'reader.html?chapter=' + prevCh;
        const nextUrl = 'reader.html?chapter=' + nextCh;

        prevBtn.href = prevUrl;
        nextBtn.href = nextUrl;
        modalNextBtn.href = nextUrl;

        // Keyboard Navigation (ArrowLeft & ArrowRight)
        document.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (e.key === 'ArrowLeft') {
                window.location.href = prevUrl;
            } else if (e.key === 'ArrowRight') {
                window.location.href = nextUrl;
            }
        });

        // Auto-Scroll Mode Implementation
        const autoScrollBtn = document.getElementById('autoScrollBtn');
        let scrollInterval = null;
        let isAutoScrolling = false;

        autoScrollBtn.addEventListener('click', () => {
            if (isAutoScrolling) {
                clearInterval(scrollInterval);
                scrollInterval = null;
                isAutoScrolling = false;
                autoScrollBtn.textContent = '▶️ Auto-Scroll';
            } else {
                isAutoScrolling = true;
                autoScrollBtn.textContent = '⏸️ Pause';
                scrollInterval = setInterval(() => {
                    window.scrollBy({ top: 2, behavior: 'smooth' });
                    // Stop if reached bottom
                    if ((window.innerHeight + window.pageYOffset) >= document.body.offsetHeight - 5) {
                        clearInterval(scrollInterval);
                        scrollInterval = null;
                        isAutoScrolling = false;
                        autoScrollBtn.textContent = '▶️ Auto-Scroll';
                    }
                }, 50);
            }
        });

        // Share Button (Web Share API + Fallback)
        const shareBtn = document.getElementById('shareBtn');
        shareBtn.addEventListener('click', async () => {
            const shareData = {
                title: document.title,
                text: 'Baca ' + document.title + ' di Perpustakaan Manhwa!',
                url: window.location.href
            };

            if (navigator.share) {
                try {
                    await navigator.share(shareData);
                } catch (err) {
                    console.log('Share canceled or failed', err);
                }
            } else {
                try {
                    await navigator.clipboard.writeText(window.location.href);
                    alert('Link chapter berhasil disalin ke clipboard!');
                } catch (err) {
                    prompt('Salin link ini:', window.location.href);
                }
            }
        });

        // Reader Settings (Width control)
        const container = document.getElementById('manhwaContainer');
        const settingButtons = document.querySelectorAll('.btn-setting[data-width]');
        const savedWidthMode = localStorage.getItem('reader_width_mode') || 'normal';

        function applyWidthMode(mode) {
            container.classList.remove('narrow', 'normal', 'wide');
            container.classList.add(mode);
            settingButtons.forEach(btn => {
                if (btn.getAttribute('data-width') === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            localStorage.setItem('reader_width_mode', mode);
        }

        applyWidthMode(savedWidthMode);

        settingButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.getAttribute('data-width');
                applyWidthMode(mode);
            });
        });

        // Bookmark / Save Last Read to localStorage
        localStorage.setItem('last_read_chapter', 'Chapter ' + chNum);
        localStorage.setItem('last_read_url', window.location.href);

        // Light/Dark Mode Script
        const themeToggleBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';

        if (currentTheme === 'light') {
            document.body.classList.add('light-mode');
            themeToggleBtn.textContent = '☀️';
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggleBtn.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // Progress bar scroll listener & Auto-Next popup detector
        const modal = document.getElementById('autoNextModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');
        let modalShown = false;

        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('progress-bar').style.width = scrolled + '%';

            if (scrolled >= 99 && !modalShown) {
                modal.classList.add('show');
                modalShown = true;
            }
        });

        modalCloseBtn.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        // Image fade-in effect on load & Skeleton Loading handling
        document.addEventListener('DOMContentLoaded', () => {
            const images = document.querySelectorAll('.manhwa-page');
            images.forEach(img => {
                if (img.complete) {
                    img.classList.add('loaded');
                } else {
                    img.addEventListener('load', () => {
                        img.classList.add('loaded');
                    });
                    img.addEventListener('error', () => {
                        img.classList.add('loaded');
                    });
                }
            });

            // Back to Top button
            const backToTopBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTopBtn.classList.add('show');
                } else {
                    backToTopBtn.classList.remove('show');
                }
            });

            backToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    </script>
</body>
</html>
